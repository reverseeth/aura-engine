<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style data-aura-fonts>/* fontes */</style>
<style>
:root{--color-background:#ffffff;--color-surface:#f5f3ef;--color-foreground:#1a1a1a;--color-primary:#1f4d3a;--color-on-primary:#ffffff;--color-accent:#c8553d;--color-muted:#5a5a5a;--color-border:#dddddd;--font-heading:Georgia,serif;--font-body:Helvetica,Arial,sans-serif;--text-1:16px;--text-2:20px;--text-3:40px;--space-1:16px;--radius-1:8px}
*{box-sizing:border-box}body{margin:0;background:var(--color-background);color:var(--color-foreground);font:var(--text-1)/1.5 var(--font-body)}
section{padding:64px 24px}.w{max-width:560px;margin:0 auto}
h1{font:var(--text-3)/1.1 var(--font-heading);margin:0 0 16px}h2{font-size:var(--text-2);margin:0 0 8px}
.cta{display:inline-block;background:var(--color-primary);color:var(--color-on-primary);padding:12px 24px;border-radius:var(--radius-1);text-decoration:none}
</style></head><body><main>
<section data-aura-section="hero"><div class="w"><h1>Calm sleep</h1><p>A short line about the product that stays inside a comfortable reading measure for everyone.</p><a class="cta" href="#offer">Buy now</a></div></section>
<section data-aura-section="offer" id="offer"><div class="w"><h2>The offer</h2><p>Second paragraph with enough words to wrap into two lines on a narrow phone screen layout here.</p></div></section>
</main></body></html>
